<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernShop | E-Commerce</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav>
        <div class="logo">Modern<span>Shop</span></div>
        <div class="cart-icon" onclick="toggleCart()">
            <i class="fas fa-shopping-cart"></i>
            <span id="cart-count">0</span>
        </div>
    </nav>
    <header class="hero">
        <h1>Upgrade Your Style</h1>
        <p>Curated products for the modern lifestyle.</p>
    </header>
    <main id="product-grid" class="container">
        </main>
    <div id="cart-drawer" class="cart-drawer">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button onclick="toggleCart()">&times;</button>
        </div>
        <div id="cart-items"></div>
        <div class="cart-footer">
            <h3>Total: $<span id="cart-total">0.00</span></h3>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
